name: Build FoolStory

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libgl1-mesa-dev \
            xorg-dev

      - name: Download modules
        run: go mod tidy

      - name: Build
        run: go build -v ./...

  arch:
    name: Build (Arch Linux)
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            go \
            gcc \
            pkgconf \
            mesa \
            libx11 \
            libxcursor \
            libxrandr \
            libxinerama \
            libxi

      - name: Download modules
        run: go mod tidy

      - name: Build
        run: go build -v ./...
