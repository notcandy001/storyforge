name: Build FoolStory

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libgl1-mesa-dev \
            xorg-dev

      - name: Download dependencies
        run: go mod download

      - name: Verify
        run: go vet ./...

      - name: Build
        run: go build -v -o foolstory .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foolstory-${{ runner.os }}
          path: |
            foolstory*
            *.exe
